name: Dependency Review

on:
  # main ブランチ向けの PR が作成・更新されたときに実行する
  pull_request:
    branches:
      - main

permissions:
  # リポジトリ内容の読み取り権限のみ付与する
  # Dependency Review Action は最小権限で動かす
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      # リポジトリの中身を Actions 実行環境にチェックアウトする
      - name: リポジトリを取得
        uses: actions/checkout@v5

      # PR に含まれる依存関係の変更をレビューする
      - name: 依存関係をレビュー
        uses: actions/dependency-review-action@v4
        with:
          # どの重大度以上を失敗扱いにするか
          # まずは high 以上から始めると運用しやすい
          fail-on-severity: high

          # 本番実行時に影響しやすい依存関係だけを主に見る
          # runtime = 実行時依存
          # unknown = GitHub 側で分類できなかった依存
          allow-dependencies-licenses: false
          vulnerability-check: true
          license-check: false

          # どの種類の依存関係を対象にするか
          # runtime と unknown を対象にする
          dependency-type: runtime

          # GitHub Advisory Database にある脆弱性を確認する
          # true が基本
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}